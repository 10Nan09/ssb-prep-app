<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SSB Prep — Login</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1a3c5e"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="SSB Prep"/>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f2740, #1a3c5e); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: white; border-radius: 24px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .app-logo { font-size: 56px; margin-bottom: 12px; }
    .app-name { font-size: 24px; font-weight: 800; color: #1a3c5e; margin-bottom: 4px; }
    .app-tagline { font-size: 13px; color: #888; margin-bottom: 28px; line-height: 1.5; }
    .features { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
    .feature { background: #f0f4f8; border-radius: 12px; padding: 12px 10px; }
    .feature-icon { font-size: 22px; margin-bottom: 4px; }
    .feature-text { font-size: 11px; color: #555; font-weight: 500; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider-line { flex: 1; height: 1px; background: #e0e7ef; }
    .divider-text { font-size: 12px; color: #aaa; }
    .google-btn { width: 100%; background: white; border: 2px solid #e0e7ef; border-radius: 12px; padding: 14px 20px; font-size: 15px; font-weight: 600; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.2s; margin-bottom: 12px; }
    .google-btn:hover { border-color: #1a3c5e; background: #f0f4ff; }
    .loading-btn { width: 100%; background: #1a3c5e; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; color: white; display: none; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .loading-btn.show { display: flex; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .error-box { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 10px; padding: 12px; font-size: 13px; color: #c62828; margin-top: 12px; display: none; }
    .error-box.show { display: block; }
    .privacy { font-size: 11px; color: #aaa; margin-top: 16px; line-height: 1.5; }
    .user-card { display: none; }
    .user-card.show { display: block; }
    .user-avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 12px; border: 3px solid #1a3c5e; }
    .user-name { font-size: 18px; font-weight: 700; color: #1a3c5e; margin-bottom: 4px; }
    .user-email { font-size: 12px; color: #888; margin-bottom: 20px; }
    .continue-btn { width: 100%; background: #1a3c5e; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .logout-btn { width: 100%; background: white; color: #e53935; border: 2px solid #ef9a9a; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  </style>
</head>

<body>
<div class="login-card">
  <div id="loginView">
    <div class="app-logo">🪖</div>
    <div class="app-name">SSB Prep App</div>
    <div class="app-tagline">ni8.ai powered personal preparation assistant<br>for your SSB Interview</div>
    <div class="features">
      <div class="feature"><div class="feature-icon">📝</div><div class="feature-text">Daily Tests</div></div>
      <div class="feature"><div class="feature-icon">🎯</div><div class="feature-text">Practice Zone</div></div>
      <div class="feature"><div class="feature-icon">🤖</div><div class="feature-text">ni8.ai Buddy</div></div>
      <div class="feature"><div class="feature-icon">📊</div><div class="feature-text">Progress Track</div></div>
    </div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">Login to continue</div>
      <div class="divider-line"></div>
    </div>
    <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="G"/>
      Continue with Google
    </button>
    <button class="loading-btn" id="loadingBtn">
      <span class="spin">⚙️</span> Signing in...
    </button>
    <div class="error-box" id="errorBox"></div>
    <div class="privacy">🔒 உன் data secure-ஆ Google account-ல sync ஆகும்.<br>Phone + Laptop எந்த device-லயும் access!</div>
  </div>

  <div class="user-card" id="userCard">
    <img class="user-avatar" id="userAvatar" src="" alt="Profile"/>
    <div class="user-name" id="userName"></div>
    <div class="user-email" id="userEmail"></div>
    <button class="continue-btn" onclick="window.location.href='pages/dashboard.html'">Continue to Dashboard →</button>
    <button class="logout-btn" onclick="doSignOut()">Sign out</button>
  </div>
</div>

<script>
  // ✅ Firebase config directly here — no config.js needed!
  const firebaseConfig = {
    apiKey: "AIzaSyDwOt1-yGEH8k3Nz5jnClk7azC22BTIkEg",
    authDomain: "ssb-prep-app-a0d89.firebaseapp.com",
    projectId: "ssb-prep-app-a0d89",
    storageBucket: "ssb-prep-app-a0d89.firebasestorage.app",
    messagingSenderId: "732676808563",
    appId: "1:732676808563:web:6a61ef219844176ba2ef06"
  };

    const CLAUDE_API_KEY = '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';

  // ✅ Initialize immediately — window.onload தேவையில்லை!
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ✅ Auth state check
  auth.onAuthStateChanged(function(user) {
    if (user) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('userCard').className = 'user-card show';
      document.getElementById('userAvatar').src = user.photoURL || '';
      document.getElementById('userName').textContent = user.displayName || 'User';
      document.getElementById('userEmail').textContent = user.email || '';
    }
  });

  // ✅ Google Sign In
  async function signInWithGoogle() {
    document.getElementById('googleBtn').style.display = 'none';
    document.getElementById('loadingBtn').className = 'loading-btn show';
    document.getElementById('errorBox').className = 'error-box';

    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      const user = result.user;

      // Save to Firestore
      await db.collection('users').doc(user.uid).set({
        name: user.displayName,
        email: user.email,
        photoURL: user.photoURL,
        lastLogin: new Date().toISOString()
      }, { merge: true });

      // Check profile
      const profileDoc = await db.collection('users').doc(user.uid)
        .collection('data').doc('profile').get();

      if (profileDoc.exists) {
        localStorage.setItem('ssbProfile', JSON.stringify(profileDoc.data()));
        window.location.href = 'pages/dashboard.html';
      } else {
        window.location.href = 'index.html';
      }

    } catch(e) {
      document.getElementById('googleBtn').style.display = 'flex';
      document.getElementById('loadingBtn').className = 'loading-btn';
      const err = document.getElementById('errorBox');
      err.className = 'error-box show';
      err.textContent = 'Login failed! ' + e.message;
      console.error('Login error:', e);
    }
  }

  // ✅ Sign out
  async function doSignOut() {
    await auth.signOut();
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('userCard').className = 'user-card';
    document.getElementById('googleBtn').style.display = 'flex';
  }
</script>
<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
